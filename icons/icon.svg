<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b1d4a"/>
      <stop offset="60%" stop-color="#180e22"/>
      <stop offset="100%" stop-color="#0a060e"/>
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="35%" stop-color="#f0c345"/>
      <stop offset="70%" stop-color="#c99320"/>
      <stop offset="100%" stop-color="#7a550d"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>

    <!-- Traditional Indian Ivory / Sandalwood Pasha Textures -->
    <linearGradient id="pashaTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffcf5"/>
      <stop offset="45%" stop-color="#f5e8cf"/>
      <stop offset="100%" stop-color="#dec49e"/>
    </linearGradient>

    <linearGradient id="pashaFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8976a"/>
      <stop offset="60%" stop-color="#8c6a3d"/>
      <stop offset="100%" stop-color="#5a401f"/>
    </linearGradient>

    <linearGradient id="pashaCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#593b0c"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="pashaOverlapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#050208" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  
  <!-- Outer Ornate Mandala Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.5"/>

  <!-- Mandala Radiating Star Petals (Traditional 8-fold Indian Motif) -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.75" filter="url(#goldGlow)">
    <polygon points="256,40 268,100 328,100 280,140 298,200 256,165 214,200 232,140 184,100 244,100"/>
    <polygon points="256,472 268,412 328,412 280,372 298,312 256,347 214,312 232,372 184,412 244,412"/>
    <polygon points="40,256 100,268 100,328 140,280 200,298 165,256 200,214 140,232 100,184 100,244"/>
    <polygon points="472,256 412,268 412,328 372,280 312,298 347,256 312,214 372,232 412,184 412,244"/>
  </g>

  <!-- Corner Lotus / Paisley Flourishes -->
  <g fill="url(#goldGrad)" opacity="0.6">
    <circle cx="80" cy="80" r="8"/>
    <circle cx="432" cy="80" r="8"/>
    <circle cx="80" cy="432" r="8"/>
    <circle cx="432" cy="432" r="8"/>
  </g>

  <!-- Central Shield Medallion -->
  <circle cx="256" cy="256" r="160" fill="#1b1026" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8"/>

  <!-- Four Color Quad Markers representing the 4 Indian Board Arms -->
  <g>
    <!-- North: Yellow Senapati -->
    <path d="M 240,112 L 272,112 L 256,134 Z" fill="#e5b222"/>
    <!-- South: Crimson Red Maharathi -->
    <path d="M 240,400 L 272,400 L 256,378 Z" fill="#d82538"/>
    <!-- West: Emerald Green Samrat -->
    <path d="M 112,240 L 112,272 L 134,256 Z" fill="#278d46"/>
    <!-- East: Sapphire Blue Yoddha -->
    <path d="M 400,240 L 400,272 L 378,256 Z" fill="#227de5"/>
  </g>

  <!-- ===================================================================== -->
  <!-- TWO AUTHENTIC INDIAN PASHAS (TRADITIONAL ELONGATED 4-SIDED STICK DICE) -->
  <!-- ===================================================================== -->
  <g id="twoPashasContainer">

    <!-- PASHA 1 (Back Rod - Angled at -26 deg) -->
    <g transform="translate(256, 235) rotate(-26)" filter="url(#shadow)">
      <!-- Main Pasha Rod Body (Top Light Face) -->
      <polygon points="-102,-14 102,-14 96,4 -96,4" fill="url(#pashaTopGrad)" stroke="#593b0c" stroke-width="1.5"/>
      <!-- Main Pasha Rod Body (Front Shaded Face) -->
      <polygon points="-96,4 96,4 96,18 -96,18" fill="url(#pashaFrontGrad)" stroke="#3a2507" stroke-width="1.5"/>
      <!-- Longitudinal Bevel Highlight -->
      <line x1="-95" y1="4" x2="95" y2="4" stroke="#fff4d4" stroke-width="1" opacity="0.75"/>

      <!-- Left End Cap (Carved Gold Ferrule) -->
      <polygon points="-104,-15 -84,-15 -80,4 -100,4" fill="url(#pashaCapGrad)" stroke="#3a2507" stroke-width="1.2"/>
      <polygon points="-100,4 -80,4 -80,19 -100,19" fill="url(#pashaCapGrad)" stroke="#2b1a04" stroke-width="1.2"/>
      <!-- Left Tip Facet & Jewel -->
      <polygon points="-104,-15 -100,4 -100,19 -106,0" fill="#7a550d" stroke="#2b1a04" stroke-width="1"/>
      <circle cx="-103" cy="2" r="3" fill="#d82538" stroke="#ffe680" stroke-width="0.8"/>

      <!-- Right End Cap (Carved Gold Ferrule) -->
      <polygon points="84,-15 104,-15 100,4 80,4" fill="url(#pashaCapGrad)" stroke="#3a2507" stroke-width="1.2"/>
      <polygon points="80,4 100,4 100,19 80,19" fill="url(#pashaCapGrad)" stroke="#2b1a04" stroke-width="1.2"/>
      <!-- Right Tip Facet & Jewel -->
      <polygon points="104,-15 100,4 100,19 106,0" fill="#ffe680" stroke="#2b1a04" stroke-width="1"/>
      <circle cx="103" cy="2" r="3" fill="#d82538" stroke="#ffe680" stroke-width="0.8"/>

      <!-- Pips on Pasha 1 (Traditional Concentric Circle Markings: 4 Pips) -->
      <!-- Pip 1 at x = -58 -->
      <g transform="translate(-58, -5) scale(1, 0.75)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="#996515" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="3.8" fill="none" stroke="#d82538" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.8" fill="#1b1026"/>
      </g>
      <!-- Pip 2 at x = -22 -->
      <g transform="translate(-22, -5) scale(1, 0.75)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="#996515" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="3.8" fill="none" stroke="#d82538" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.8" fill="#1b1026"/>
      </g>
      <!-- Pip 3 at x = +22 -->
      <g transform="translate(22, -5) scale(1, 0.75)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="#996515" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="3.8" fill="none" stroke="#d82538" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.8" fill="#1b1026"/>
      </g>
      <!-- Pip 4 at x = +58 -->
      <g transform="translate(58, -5) scale(1, 0.75)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="#996515" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="3.8" fill="none" stroke="#d82538" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.8" fill="#1b1026"/>
      </g>
    </g>

    <!-- PASHA 2 (Front Rod - Angled at +26 deg, overlapping in 3D) -->
    <g transform="translate(256, 235) rotate(26)" filter="url(#pashaOverlapShadow)">
      <!-- Main Pasha Rod Body (Top Light Face) -->
      <polygon points="-102,-14 102,-14 96,4 -96,4" fill="url(#pashaTopGrad)" stroke="#593b0c" stroke-width="1.5"/>
      <!-- Main Pasha Rod Body (Front Shaded Face) -->
      <polygon points="-96,4 96,4 96,18 -96,18" fill="url(#pashaFrontGrad)" stroke="#3a2507" stroke-width="1.5"/>
      <!-- Longitudinal Bevel Highlight -->
      <line x1="-95" y1="4" x2="95" y2="4" stroke="#fff4d4" stroke-width="1" opacity="0.75"/>

      <!-- Left End Cap (Carved Gold Ferrule) -->
      <polygon points="-104,-15 -84,-15 -80,4 -100,4" fill="url(#pashaCapGrad)" stroke="#3a2507" stroke-width="1.2"/>
      <polygon points="-100,4 -80,4 -80,19 -100,19" fill="url(#pashaCapGrad)" stroke="#2b1a04" stroke-width="1.2"/>
      <!-- Left Tip Facet & Jewel -->
      <polygon points="-104,-15 -100,4 -100,19 -106,0" fill="#7a550d" stroke="#2b1a04" stroke-width="1"/>
      <circle cx="-103" cy="2" r="3" fill="#227de5" stroke="#ffe680" stroke-width="0.8"/>

      <!-- Right End Cap (Carved Gold Ferrule) -->
      <polygon points="84,-15 104,-15 100,4 80,4" fill="url(#pashaCapGrad)" stroke="#3a2507" stroke-width="1.2"/>
      <polygon points="80,4 100,4 100,19 80,19" fill="url(#pashaCapGrad)" stroke="#2b1a04" stroke-width="1.2"/>
      <!-- Right Tip Facet & Jewel -->
      <polygon points="104,-15 100,4 100,19 106,0" fill="#ffe680" stroke="#2b1a04" stroke-width="1"/>
      <circle cx="103" cy="2" r="3" fill="#227de5" stroke="#ffe680" stroke-width="0.8"/>

      <!-- Pips on Pasha 2 (Traditional Concentric Circle Markings: 3 Pips) -->
      <!-- Pip 1 at x = -48 -->
      <g transform="translate(-48, -5) scale(1, 0.75)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="#996515" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="3.8" fill="none" stroke="#d82538" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.8" fill="#1b1026"/>
      </g>
      <!-- Pip 2 at Center x = 0 (Royal Focal Point) -->
      <g transform="translate(0, -5) scale(1, 0.75)">
        <circle cx="0" cy="0" r="7" fill="none" stroke="#f0c345" stroke-width="1.6"/>
        <circle cx="0" cy="0" r="4.5" fill="none" stroke="#d82538" stroke-width="1.3"/>
        <circle cx="0" cy="0" r="2.2" fill="#227de5"/>
      </g>
      <!-- Pip 3 at x = +48 -->
      <g transform="translate(48, -5) scale(1, 0.75)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="#996515" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="3.8" fill="none" stroke="#d82538" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="1.8" fill="#1b1026"/>
      </g>
    </g>

  </g>

  <!-- Royal Banner Ribbon & Typography -->
  <g transform="translate(0, 396)">
    <!-- Banner Shadow & Backdrop -->
    <path d="M 100,28 L 130,50 L 100,72 L 412,72 L 382,50 L 412,28 Z" fill="#4d161d" opacity="0.8"/>
    <rect x="120" y="24" width="272" height="48" rx="8" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Title Text -->
    <text x="256" y="56" font-family="'Cinzel', 'Outfit', 'Georgia', serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="3.5" filter="url(#goldGlow)">
      PASHA PALLI
    </text>
  </g>
</svg>
